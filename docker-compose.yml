services:
  postgres:
    image: postgres:16-alpine
    container_name: decision-engine-db
    environment:
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: engine_dev
      POSTGRES_DB: decision_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine -d decision_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
