# Datasource
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=engine
%dev.quarkus.datasource.password=engine_dev
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/decision_engine

# Flyway
quarkus.flyway.migrate-at-start=true

# Health
quarkus.smallrye-health.root-path=/q/health

# Logging - Dev (plain text)
%dev.quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
%dev.quarkus.log.category."com.sky.synome".level=DEBUG
%dev.quarkus.log.category."org.drools".level=WARN
%test.quarkus.log.category."com.sky.synome.changeset".level=ERROR

# Logging - Prod (JSON structured)
%prod.quarkus.log.console.json=true
%prod.quarkus.log.level=INFO
%prod.quarkus.log.category."com.sky.synome".level=INFO
%prod.quarkus.log.category."org.drools".level=WARN

# Disable JSON logging in dev
%dev.quarkus.log.console.json=false
%test.quarkus.log.console.json=false
%test.quarkus.datasource.devservices.enabled=false

# Engine config
engine.rules-path=rules
engine.default-rules-file=bootstrap-rules.drl
engine.lock-timeout-ms=5000
engine.checkpoint-enabled=true
engine.checkpoint-scheduler-enabled=true
engine.checkpoint-interval=10m
engine.checkpoint-retain-count=20
engine.recovery-enabled=true
engine.event-replay-enabled=true
engine.event-replay-window=30m
engine.event-entrypoints=transactions
engine.provenance-queue-capacity=2000
engine.provenance-batch-size=100
engine.provenance-flush-interval=500ms
engine.provenance-retry-backoff=200ms
%test.engine.checkpoint-scheduler-enabled=false
%test.engine.recovery-enabled=false

# Test datasource default (overridden by test resource when available)
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.username=engine
%test.quarkus.datasource.password=engine_dev
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/decision_engine
